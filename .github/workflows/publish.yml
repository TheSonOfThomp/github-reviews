name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # changesets' `published` output is never true for this repo: the
      # release script is `changeset tag`, which publishes nothing for a
      # private package (no tags are ever created). Gate the store publish
      # on the version bump itself — the merge of a Version Packages PR.
      versionChanged: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need HEAD^ to diff the version

      - name: Detect version bump
        id: bump
        run: |
          if [ "$(git rev-list --count HEAD)" -lt 2 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old=$(git show HEAD^:package.json | jq -r .version)
          new=$(jq -r .version package.json)
          if [ "$old" != "$new" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate build
        run: pnpm build

      - name: Create Release PR or tag release
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: version
    if: needs.version.outputs.versionChanged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Strip dev manifest key
        # The `key` field pins a deterministic ID for local/unpacked loads;
        # it must not ship to the Chrome Web Store, which assigns its own ID.
        run: node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('build/manifest.json','utf8'));delete m.key;fs.writeFileSync('build/manifest.json',JSON.stringify(m,null,2)+'\n')"

      - name: Zip extension
        run: cd build && zip -r ../extension.zip .

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.EXTENSION_ID }}
          publisher-id: ${{ secrets.GOOGLE_PUBLISHER_ID }}
          client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
